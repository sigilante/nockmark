[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nockmark"
version = "0.1.0"
description = "Annotated code fragments (boxes, notes, arrows) for Sphinx and MyST, with a matching LaTeX package"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sigilante" }]
requires-python = ">=3.9"
dependencies = ["sphinx>=5", "docutils", "pygments"]
keywords = ["sphinx", "myst", "jupyter-book", "nock", "latex", "annotation"]
classifiers = [
  "Framework :: Sphinx :: Extension",
  "Topic :: Documentation :: Sphinx",
  "Topic :: Text Processing :: Markup :: LaTeX",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/sigilante/nockmark"

[tool.hatch.build.targets.wheel]
packages = ["src/nockmark"]

[tool.hatch.build.targets.wheel.force-include]
"tex/nockmark.sty" = "nockmark/nockmark.sty"

[tool.hatch.build.targets.sdist]
include = ["src", "tex", "doc/nockmark.tex", "README.md", "LICENSE", "pyproject.toml"]
